<script type="module">
  // 1. استيراد المكتبات اللازمة (الدخول وقاعدة البيانات)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 2. إعدادات مشروعك (ezzchat-org)
  const firebaseConfig = {
    apiKey: "AIzaSyAdKs4FczUGJYh-_uzfEzndocEx-x1VDAA",
    authDomain: "ezzchat-org.firebaseapp.com",
    projectId: "ezzchat-org",
    storageBucket: "ezzchat-org.firebasestorage.app",
    messagingSenderId: "704328739546",
    appId: "1:704328739546:web:57cb68963c10e27c9293e3",
    measurementId: "G-TPTMZVR1Q7"
  };

  // 3. تشغيل الخدمات
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // --- هنا تبدأ "كهرباء" التطبيق ---

  // وظيفة تسجيل مستخدم جديد
  window.signUp = (email, password) => {
    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        alert("تم إنشاء الحساب بنجاح!");
      })
      .catch((error) => {
        alert("خطأ: " + error.message);
      });
  };

  // وظيفة إرسال رسالة
  window.sendMessage = async (text, room) => {
    if (text.trim() === "") return;
    try {
      await addDoc(collection(db, "messages"), {
        text: text,
        room: room,
        sender: auth.currentUser.email,
        createdAt: serverTimestamp()
      });
    } catch (e) {
      console.error("خطأ في الإرسال: ", e);
    }
  };

  console.log("Ezz Chat Engine is Ready!");
</script>
