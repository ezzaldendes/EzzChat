<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ezz Chat Pro</title>
    <style>
        :root { --primary: #075e54; --owner: #d9534f; --mod: #0275d8; }
        body { font-family: sans-serif; margin: 0; background: #e5ddd5; height: 100vh; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: white; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* الهيدر */
        .header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .user-meta { display: flex; flex-direction: column; }
        .user-meta b { font-size: 16px; }
        .role-badge { font-size: 10px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; width: fit-content; }

        /* الأزرار */
        .icon-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        
        /* منطقة الرسائل */
        #msg-flow { flex-grow: 1; overflow-y: auto; padding: 15px; background: #e5ddd5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .msg { background: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; max-width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg b { color: var(--primary); font-size: 13px; }
        
        /* الأدوات */
        .mod-tools { display: flex; gap: 10px; margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px; font-size: 12px; }
        .del-btn { color: red; cursor: pointer; }

        /* الإدخال */
        .footer { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="user-meta">
            <b id="user-display">جاري التحميل...</b>
            <span id="role-text" class="role-badge">تحميل الرتبة...</span>
        </div>
        <div style="display: flex; gap: 5px;">
            <button class="icon-btn" onclick="window.location.href='admin.html'" id="admin-icon" style="display:none;">🛡️</button>
            <button class="icon-btn" onclick="window.location.href='profile.html'">⚙️</button>
            <button class="icon-btn" id="logout-btn">🚪</button>
        </div>
    </div>

    <div id="msg-flow"></div>

    <div class="footer">
        <input type="text" id="msg-input" placeholder="اكتب رسالة...">
        <button class="send-btn" id="send-btn">➤</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAdKs4FczUGJYh-_uzfEzndocEx-x1VDAA",
        authDomain: "ezzchat-org.firebaseapp.com",
        projectId: "ezzchat-org",
        storageBucket: "ezzchat-org.firebasestorage.app",
        messagingSenderId: "704328739546",
        appId: "1:704328739546:web:57cb68963c10e27c9293e3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let myData = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            myData = snap.data();
            document.getElementById('user-display').innerText = myData.name;
            document.getElementById('role-text').innerText = myData.role === 'owner' ? 'المالك' : (myData.role === 'mod' ? 'مشرف' : 'عضو');
            if(myData.role === 'owner') document.getElementById('admin-icon').style.display = 'block';
        } else {
            // حل مشكلة الحسابات القديمة
            document.getElementById('user-display').innerText = user.email.split('@')[0];
            document.getElementById('role-text').innerText = "عضو (ملف غير مكتمل)";
            myData = { name: user.email, role: 'user', status: 'active' };
        }
        loadChat();
    });

    function loadChat() {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const flow = document.getElementById('msg-flow');
            flow.innerHTML = "";
            snapshot.forEach(res => {
                const m = res.data();
                const div = document.createElement('div');
                div.className = 'msg';
                
                // صلاحيات الحذف للمالك والمشرف
                const canDelete = myData.role === 'owner' || (myData.role === 'mod' && m.senderRole === 'user');
                let tools = canDelete ? `<div class="mod-tools"><span class="del-btn" onclick="deleteMsg('${res.id}')">حذف 🗑️</span></div>` : "";

                div.innerHTML = `<b>${m.senderName}</b><br>${m.text}${tools}`;
                flow.appendChild(div);
            });
            flow.scrollTop = flow.scrollHeight;
        });
    }

    document.getElementById('send-btn').onclick = async () => {
        const inp = document.getElementById('msg-input');
        if(inp.value.trim()){
            await addDoc(collection(db, "messages"), {
                text: inp.value,
                senderName: myData.name || auth.currentUser.email,
                senderRole: myData.role || 'user',
                createdAt: serverTimestamp()
            });
            inp.value = "";
        }
    };

    window.deleteMsg = async (id) => {
        if(confirm("حذف الرسالة؟")) await deleteDoc(doc(db, "messages", id));
    };

    document.getElementById('logout-btn').onclick = () => signOut(auth);
</script>
</body>
</html>
