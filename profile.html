<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Ezz Chat</title>
    <style>
        :root { --primary: #075e54; --bg: #f4f4f4; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .profile-card { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header-title { text-align: center; color: var(--primary); margin-bottom: 30px; }
        
        .info-item { position: relative; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-item label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .info-item input { width: 90%; border: none; font-size: 16px; color: var(--text); outline: none; background: none; font-weight: 500; }
        .edit-icon { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 18px; cursor: pointer; }

        .action-btns { margin-top: 30px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.3s; font-size: 15px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-pass { background: #fff; color: #d9534f; border: 1px solid #d9534f; }
        .btn-back { background: #eee; color: #666; }
        
        #status-toast { text-align: center; font-size: 13px; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="header-title">
        <h3>إعدادات الحساب ⚙️</h3>
    </div>

    <div id="status-toast"></div>

    <div class="info-item">
        <label>الاسم الكامل</label>
        <input type="text" id="edit-name" value="جاري التحميل...">
        <span class="edit-icon">✎</span>
    </div>

    <div class="info-item">
        <label>اسم المستخدم</label>
        <input type="text" id="edit-username" value="...">
        <span class="edit-icon">✎</span>
    </div>

    <div class="info-item">
        <label>البريد الإلكتروني</label>
        <input type="email" id="edit-email" value="...">
        <span class="edit-icon">✎</span>
    </div>

    <div class="action-btns">
        <button class="btn btn-save" id="save-all">حفظ التغييرات</button>
        <button class="btn btn-pass" id="change-pass-trigger">تغيير كلمة السر 🔑</button>
        <button class="btn btn-back" onclick="window.location.href='chat.html'">العودة للدردشة</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, updateEmail, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAdKs4FczUGJYh-_uzfEzndocEx-x1VDAA",
        authDomain: "ezzchat-org.firebaseapp.com",
        projectId: "ezzchat-org",
        storageBucket: "ezzchat-org.firebasestorage.app",
        messagingSenderId: "704328739546",
        appId: "1:704328739546:web:57cb68963c10e27c9293e3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // جلب البيانات عند الفتح
    onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            document.getElementById('edit-name').value = snap.data().name;
            document.getElementById('edit-username').value = snap.data().username;
            document.getElementById('edit-email').value = user.email;
        }
    });

    // دالة إظهار التنبيه
    function showToast(msg, isError = false) {
        const t = document.getElementById('status-toast');
        t.innerText = msg;
        t.style.display = 'block';
        t.style.background = isError ? '#ffebee' : '#e8f5e9';
        t.style.color = isError ? '#c62828' : '#2e7d32';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // زر الحفظ العام
    document.getElementById('save-all').onclick = async () => {
        const user = auth.currentUser;
        const name = document.getElementById('edit-name').value;
        const userN = document.getElementById('edit-username').value;
        const email = document.getElementById('edit-email').value;

        const pass = prompt("لتأكيد الحفظ، أدخل كلمة المرور الحالية:");
        if (!pass) return;

        try {
            const cred = EmailAuthProvider.credential(user.email, pass);
            await reauthenticateWithCredential(user, cred);

            if (email !== user.email) await updateEmail(user, email);

            await updateDoc(doc(db, "users", user.uid), {
                name: name,
                username: userN,
                email: email,
                status: "active"
            });
            showToast("✅ تم تحديث البيانات بنجاح");
        } catch (e) { showToast("❌ خطأ: " + e.message, true); }
    };

    // زر تغيير كلمة السر فقط
    document.getElementById('change-pass-trigger').onclick = async () => {
        const oldP = prompt("أدخل كلمة المرور الحالية:");
        const newP = prompt("أدخل كلمة المرور الجديدة (6 أحرف على الأقل):");
        
        if (oldP && newP) {
            try {
                const cred = EmailAuthProvider.credential(auth.currentUser.email, oldP);
                await reauthenticateWithCredential(auth.currentUser, cred);
                await updatePassword(auth.currentUser, newP);
                showToast("✅ تم تغيير كلمة السر بنجاح");
            } catch (e) { showToast("❌ فشل التغيير: " + e.message, true); }
        }
    };
</script>
</body>
</html>
